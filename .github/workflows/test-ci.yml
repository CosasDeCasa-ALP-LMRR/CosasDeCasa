name: Pruebas Automatizadas (Playwright)

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  test-e2e-api:
    name: Ejecutar pruebas E2E y API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Levantar entorno local con Docker Compose
        run: docker compose up -d --build

      - name: Esperar a que la base de datos esté lista
        run: sleep 15

      - name: Ejecutar migraciones de Prisma
        run: docker exec cosasdecasa_backend npx prisma db push

      - name: Esperar a que el Backend y Frontend estén listos
        run: npx wait-on -k -t 120000 https://localhost:3000 https://localhost:5173

      - name: Configurar Node.js para Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright y Navegadores
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps

      - name: Ejecutar Pruebas Automatizadas (Playwright)
        run: npx playwright test

      - name: Subir Reporte de Pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
